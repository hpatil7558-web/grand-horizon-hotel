<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account | Grand Horizon Hotel</title>

    <link rel="stylesheet" href="css/style.css">

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f3ee;
        }

        .register-page {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;

            background:
                linear-gradient(
                    rgba(20,30,30,.72),
                    rgba(20,30,30,.72)
                ),
                url("https://images.unsplash.com/photo-1564501049412-61c2a3083791?auto=format&fit=crop&w=1800&q=85")
                center/cover;
        }

        .register-card {
            width: 100%;
            max-width: 500px;
            background: white;
            padding: 40px;
            box-shadow: 0 15px 50px rgba(0,0,0,.25);
        }

        .register-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .register-icon {
            width: 55px;
            height: 55px;
            margin: auto;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid #a47b42;
            color: #a47b42;
            font-weight: bold;
        }

        .register-header h1 {
            font-family: Georgia, serif;
            color: #1c2b2b;
            margin: 15px 0 5px;
        }

        .register-header p {
            color: #a47b42;
            font-size: 11px;
            letter-spacing: 2px;
        }

        .register-card h2 {
            text-align: center;
            font-family: Georgia, serif;
            color: #1c2b2b;
            margin-bottom: 25px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 17px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group.full {
            grid-column: 1 / -1;
        }

        .form-group label {
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 7px;
        }

        .form-group input {
            padding: 13px;
            border: 1px solid #ddd;
            outline: none;
        }

        .form-group input:focus {
            border-color: #a47b42;
        }

        .terms {
            margin: 20px 0;
            font-size: 12px;
            color: #666;
            line-height: 1.6;
        }

        .terms a {
            color: #a47b42;
        }

        .register-btn {
            width: 100%;
            padding: 15px;
            border: none;
            background: #1c2b2b;
            color: white;
            cursor: pointer;
            letter-spacing: 1px;
        }

        .register-btn:hover {
            background: #a47b42;
        }

        .login-link {
            text-align: center;
            margin-top: 25px;
            font-size: 14px;
            color: #666;
        }

        .login-link a {
            color: #a47b42;
            text-decoration: none;
            font-weight: bold;
        }

        .back-home {
            display: block;
            text-align: center;
            margin-top: 18px;
            color: #777;
            text-decoration: none;
            font-size: 13px;
        }

        @media (max-width: 550px) {

            .register-card {
                padding: 28px 22px;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .form-group.full {
                grid-column: auto;
            }

        }

    </style>

</head>


<body>


    <main class="register-page">

        <div class="register-card">


            <div class="register-header">

                <div class="register-icon">
                    GH
                </div>

                <h1>Grand Horizon</h1>

                <p>HOTEL & RESORT</p>

            </div>


            <h2>Create Your Account</h2>


            <form id="registerForm">


                <div class="form-grid">


                    <div class="form-group">

                        <label for="firstName">
                            First Name
                        </label>

                        <input
                            type="text"
                            id="firstName"
                            placeholder="First name"
                            required>

                    </div>


                    <div class="form-group">

                        <label for="lastName">
                            Last Name
                        </label>

                        <input
                            type="text"
                            id="lastName"
                            placeholder="Last name"
                            required>

                    </div>


                    <div class="form-group full">

                        <label for="registerEmail">
                            Email Address
                        </label>

                        <input
                            type="email"
                            id="registerEmail"
                            placeholder="example@email.com"
                            required>

                    </div>


                    <div class="form-group">

                        <label for="phone">
                            Phone Number
                        </label>

                        <input
                            type="tel"
                            id="phone"
                            placeholder="+91 XXXXX XXXXX"
                            required>

                    </div>


                    <div class="form-group">

                        <label for="city">
                            City
                        </label>

                        <input
                            type="text"
                            id="city"
                            placeholder="Your city"
                            required>

                    </div>


                    <div class="form-group">

                        <label for="registerPassword">
                            Password
                        </label>

                        <input
                            type="password"
                            id="registerPassword"
                            placeholder="Create password"
                            required>

                    </div>


                    <div class="form-group">

                        <label for="confirmPassword">
                            Confirm Password
                        </label>

                        <input
                            type="password"
                            id="confirmPassword"
                            placeholder="Confirm password"
                            required>

                    </div>


                </div>


                <div class="terms">

                    <label>

                        <input
                            type="checkbox"
                            id="terms"
                            required>

                        I agree to the hotel's
                        <a href="#">Terms & Conditions</a>
                        and
                        <a href="#">Privacy Policy</a>.

                    </label>

                </div>


                <button
                    type="submit"
                    class="register-btn">

                    CREATE ACCOUNT

                </button>


            </form>


            <div class="login-link">

                Already have an account?

                <a href="login.html">
                    Login
                </a>

            </div>


            <a href="index.html" class="back-home">
                ← Back to Home
            </a>


        </div>

    </main>


    <script>

        document
            .getElementById("registerForm")
            .addEventListener("submit", function(event) {

                event.preventDefault();


                const password =
                    document.getElementById(
                        "registerPassword"
                    ).value;


                const confirmPassword =
                    document.getElementById(
                        "confirmPassword"
                    ).value;


                if (password.length < 6) {

                    alert(
                        "Password must contain at least 6 characters."
                    );

                    return;

                }


                if (password !== confirmPassword) {

                    alert(
                        "Passwords do not match."
                    );

                    return;

                }


                alert(
                    "Account created successfully! 🎉\n\n" +
                    "You can now login to Grand Horizon Hotel."
                );


                window.location.href =
                    "login.html";

            });

    </script>

</body>

</html>
