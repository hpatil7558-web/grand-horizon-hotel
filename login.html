<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Grand Horizon Hotel</title>

    <link rel="stylesheet" href="css/style.css">

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f3ee;
        }

        .login-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            background:
                linear-gradient(rgba(20, 30, 30, .72), rgba(20, 30, 30, .72)),
                url("https://images.unsplash.com/photo-1566073771259-6a8506099945?auto=format&fit=crop&w=1800&q=85")
                center/cover;
        }

        .login-card {
            width: 100%;
            max-width: 440px;
            background: white;
            padding: 40px;
            box-shadow: 0 15px 50px rgba(0,0,0,.25);
        }

        .login-logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .login-logo .icon {
            display: inline-flex;
            width: 55px;
            height: 55px;
            align-items: center;
            justify-content: center;
            border: 1px solid #a47b42;
            color: #a47b42;
            font-weight: bold;
            margin-bottom: 12px;
        }

        .login-logo h1 {
            font-family: Georgia, serif;
            font-size: 25px;
            color: #1c2b2b;
            margin: 5px 0;
        }

        .login-logo p {
            color: #a47b42;
            font-size: 11px;
            letter-spacing: 2px;
        }

        .login-card h2 {
            text-align: center;
            font-family: Georgia, serif;
            color: #1c2b2b;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 7px;
        }

        .form-group input {
            width: 100%;
            padding: 14px;
            border: 1px solid #ddd;
            box-sizing: border-box;
            outline: none;
        }

        .form-group input:focus {
            border-color: #a47b42;
        }

        .login-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 5px 0 22px;
            font-size: 13px;
        }

        .login-options a {
            color: #a47b42;
            text-decoration: none;
        }

        .login-btn-main {
            width: 100%;
            padding: 15px;
            border: none;
            background: #1c2b2b;
            color: white;
            cursor: pointer;
            font-size: 14px;
            letter-spacing: 1px;
        }

        .login-btn-main:hover {
            background: #a47b42;
        }

        .register-link {
            text-align: center;
            margin-top: 25px;
            font-size: 14px;
            color: #666;
        }

        .register-link a {
            color: #a47b42;
            font-weight: bold;
            text-decoration: none;
        }

        .back-home {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #777;
            text-decoration: none;
            font-size: 13px;
        }

        @media (max-width: 500px) {
            .login-card {
                padding: 28px 22px;
            }
        }
    </style>

</head>

<body>

    <main class="login-page">

        <div class="login-card">

            <div class="login-logo">

                <div class="icon">
                    GH
                </div>

                <h1>Grand Horizon</h1>

                <p>HOTEL & RESORT</p>

            </div>

            <h2>Welcome Back</h2>

            <form id="loginForm">

                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required>

                </div>

                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        required>

                </div>

                <div class="login-options">

                    <label>
                        <input type="checkbox">
                        Remember me
                    </label>

                    <a href="#">
                        Forgot Password?
                    </a>

                </div>

                <button
                    type="submit"
                    class="login-btn-main">

                    LOGIN

                </button>

            </form>

            <div class="register-link">

                Don't have an account?

                <a href="register.html">
                    Create Account
                </a>

            </div>

            <a href="index.html" class="back-home">
                ← Back to Home
            </a>

        </div>

    </main>


    <script>

        document
            .getElementById("loginForm")
            .addEventListener("submit", function(event) {

                event.preventDefault();

                const email =
                    document.getElementById("email").value;

                const password =
                    document.getElementById("password").value;

                if (!email || !password) {
                    alert("Please enter your email and password.");
                    return;
                }

                alert(
                    "Login successful! 🎉\n\n" +
                    "Welcome back to Grand Horizon Hotel."
                );

            });

    </script>

</body>

</html>
